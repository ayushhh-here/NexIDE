name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    # Dummy values so `next build` and `prisma generate` succeed in CI without
    # real secrets. Nothing here talks to a live database or OAuth provider -
    # the build only needs these to be *present*, not valid.
    env:
      DATABASE_URL: "mongodb://localhost:27017/ci"
      AUTH_SECRET: "ci-only-placeholder-secret"
      AUTH_GITHUB_ID: "ci-placeholder"
      AUTH_GITHUB_SECRET: "ci-placeholder"
      AUTH_GOOGLE_ID: "ci-placeholder"
      AUTH_GOOGLE_SECRET: "ci-placeholder"
      OLLAMA_URL: "http://localhost:11434"
      OLLAMA_MODEL: "codellama:latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
